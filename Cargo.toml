[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/Timtendo12/Rust-Mine-imator"

[workspace.dependencies]
mi-core = { path = "crates/mi-core" }
mi-anim = { path = "crates/mi-anim" }
mi-format = { path = "crates/mi-format" }
mi-project = { path = "crates/mi-project" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[profile.dev.package."*"]
opt-level = 2
